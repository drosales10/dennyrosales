    contextLength: 131072
    roles: [chat, edit, apply]

  - name: kimi-k2.6-cloud
    provider: ollama
    model: kimi-k2.6:cloud
    apiBase: http://127.0.0.1:11434
    contextLength: 131072
    roles: [chat]

  - name: glm-5-cloud
    provider: ollama
    model: glm-5:cloud
    apiBase: http://127.0.0.1:11434
    contextLength: 131072
    roles: [chat]

  - name: glm-5.1-cloud
    provider: ollama
    model: glm-5.1:cloud
    apiBase: http://127.0.0.1:11434
    contextLength: 131072
    roles: [chat]

  - name: llama3.1-8b
    provider: ollama
    model: llama3.1:8b
    apiBase: http://127.0.0.1:11434
    contextLength: 131072
    roles: [chat]

  - name: deepseek-coder-6.7b
    provider: ollama
    model: deepseek-coder:6.7b
